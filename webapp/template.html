<meta charset="utf-8">
<title>False Weight Atlas</title>
<style>
/* ============================================================ tokens */
:root{
  --ground:#e9ebee; --surface:#f7f8fa; --surface-2:#eef0f3; --sunken:#dfe3e8;
  --ink:#161a1f; --ink-2:#39424d; --muted:#66717e; --faint:#93a0ae;
  --line:#cfd6de; --line-soft:#dde3ea;
  --heat:#c2451a; --heat-soft:#f0d5c9; --heat-ink:#8f3212;
  --quench:#2f6f8f; --quench-soft:#cfdfe8; --quench-ink:#23566f;
  --good:#3f7d55; --warn:#9a6a12; --crit:#b03b26;
  --shadow:0 1px 2px rgba(20,28,38,.07), 0 8px 24px -12px rgba(20,28,38,.22);
  --radius:7px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --script:"Courier New",Courier,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101419; --surface:#171d24; --surface-2:#1d242c; --sunken:#0b0e12;
    --ink:#e4e8ec; --ink-2:#b9c2cc; --muted:#8b96a3; --faint:#5f6b78;
    --line:#2b343e; --line-soft:#222a33;
    --heat:#e2723f; --heat-soft:#3a2318; --heat-ink:#f0a077;
    --quench:#6aa8c6; --quench-soft:#152935; --quench-ink:#9cc9dd;
    --good:#67a97e; --warn:#c99b45; --crit:#d4715c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#101419; --surface:#171d24; --surface-2:#1d242c; --sunken:#0b0e12;
  --ink:#e4e8ec; --ink-2:#b9c2cc; --muted:#8b96a3; --faint:#5f6b78;
  --line:#2b343e; --line-soft:#222a33;
  --heat:#e2723f; --heat-soft:#3a2318; --heat-ink:#f0a077;
  --quench:#6aa8c6; --quench-soft:#152935; --quench-ink:#9cc9dd;
  --good:#67a97e; --warn:#c99b45; --crit:#d4715c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; text-wrap:balance; margin:0}
a{color:var(--quench)}
:focus-visible{outline:2px solid var(--heat); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================================================ shell */
.app{display:grid; grid-template-columns:236px 1fr; height:calc(100vh - 46px); overflow:hidden}

.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow-y:auto;
}
.brand{padding:20px 20px 16px; border-bottom:1px solid var(--line-soft)}
.brand .mark{
  display:flex; align-items:baseline; gap:8px; font-family:var(--serif);
  font-size:19px; font-weight:600; letter-spacing:-.01em;
}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--heat);flex:none;transform:translateY(-2px)}
.brand .sub{
  margin-top:5px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--faint); font-weight:600;
}
.nav{padding:10px 10px 16px; display:flex; flex-direction:column; gap:1px}
.nav button{
  display:grid; grid-template-columns:30px 1fr; align-items:center; gap:2px;
  width:100%; text-align:left; padding:9px 10px; border:0; border-radius:var(--radius);
  background:transparent; color:var(--ink-2); font:inherit; font-size:14px; cursor:pointer;
  transition:background .12s, color .12s;
}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="true"]{background:var(--sunken); color:var(--ink); font-weight:600}
.nav button[aria-current="true"] .layer{color:var(--heat)}
.nav .layer{
  font-family:var(--mono); font-size:10px; font-weight:700; color:var(--faint);
  letter-spacing:.04em;
}
.rail-foot{margin-top:auto; padding:14px 16px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--faint)}
.rail-foot .row{display:flex; justify-content:space-between; gap:8px; padding:2px 0}
.rail-foot b{font-family:var(--mono); font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums}

.main{display:flex; flex-direction:column; overflow:hidden; min-width:0}
.topbar{
  display:flex; align-items:center; gap:14px; padding:0 20px; height:54px;
  border-bottom:1px solid var(--line); background:var(--surface); flex:none;
}
.topbar h1{font-size:17px; letter-spacing:-.01em}
.topbar .crumb{font-size:12px; color:var(--faint); font-family:var(--mono)}
.spacer{flex:1}
.btn{
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  font:inherit; font-size:13px; padding:6px 12px; border-radius:var(--radius); cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:var(--sunken); color:var(--ink); border-color:var(--faint)}
.btn.primary{background:var(--heat); border-color:var(--heat); color:#fff}
.btn.primary:hover{filter:brightness(1.08); background:var(--heat)}
.btn.sm{padding:3px 9px; font-size:12px}

.view{flex:1; overflow:auto; min-height:0}
.pad{padding:30px 34px 110px; max-width:1180px}
.prose-w{max-width:70ch}

/* ============================================================ bits */
.eyebrow{
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
  font-weight:700; margin-bottom:8px;
}
.card{
  background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:18px 20px;
}
.card.raised{box-shadow:var(--shadow)}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stack{display:flex; flex-direction:column; gap:14px}
.mono{font-family:var(--mono); font-size:12.5px}
.tag{
  display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line-soft);
  color:var(--muted); white-space:nowrap;
}
.tag.heat{background:var(--heat-soft); border-color:transparent; color:var(--heat-ink)}
.tag.quench{background:var(--quench-soft); border-color:transparent; color:var(--quench-ink)}
.tags{display:flex; flex-wrap:wrap; gap:5px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:14px}
.kv dt{color:var(--muted); font-size:12.5px}
.kv dd{margin:0; color:var(--ink)}
.divider{height:1px; background:var(--line-soft); margin:26px 0}
h2.sec{font-size:22px; margin:34px 0 14px; letter-spacing:-.01em}
h2.sec:first-child{margin-top:0}
h3.sub{font-size:15px; font-family:var(--sans); font-weight:650; margin:0 0 8px; color:var(--ink)}
p{margin:0 0 12px}
p:last-child{margin-bottom:0}
.lede{font-family:var(--serif); font-size:19px; line-height:1.5; color:var(--ink-2)}
.empty{color:var(--faint); font-style:italic; padding:40px 0}

/* meters */
.meter{display:grid; grid-template-columns:150px 1fr 34px; align-items:center; gap:10px; padding:3px 0}
.meter .nm{font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meter .track{height:6px; background:var(--sunken); border-radius:3px; overflow:hidden; position:relative}
.meter .fill{height:100%; background:var(--quench); border-radius:3px}
.meter .fill.hot{background:var(--heat)}
.meter .val{font-family:var(--mono); font-size:11.5px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.meter .nm[title]{cursor:help}

/* ============================================================ graph */
/* The sidebar is a fixed part of the layout, not something that appears on
   click. Selecting a node only swaps the panel's CONTENT, so the canvas is
   never resized and nothing moves. The width changes only when the reader
   explicitly collapses the panel — and even then, synchronously. */
.graphwrap{display:grid; grid-template-columns:minmax(0,1fr) clamp(400px,31vw,560px);
  height:100%; min-height:0;
  /* .view is switched to display:flex for graph tabs, so this is a flex item.
     Without these three it is sized by its own content, and the panel width
     then drifts as the panel's content changes. */
  flex:1 1 auto; width:100%; min-width:0}
.graphwrap.collapsed{grid-template-columns:minmax(0,1fr) 0}
.graphwrap.collapsed .inspector{border-left:0}
.insp-empty{padding:40px 20px; color:var(--faint); font-size:13.5px; line-height:1.6}
.insp-empty b{display:block; color:var(--muted); font-size:12px; letter-spacing:.09em;
  text-transform:uppercase; margin-bottom:8px}
.panel-toggle{margin-left:auto}
.canvas-area{position:relative; min-width:0; background:var(--ground); overflow:hidden}
canvas{display:block; width:100%; height:100%; cursor:grab; touch-action:none}
canvas.dragging{cursor:grabbing}
.ctrls{
  position:absolute; left:14px; top:14px; display:flex; gap:6px; align-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:5px 6px; box-shadow:var(--shadow); flex-wrap:wrap; max-width:calc(100% - 28px);
}
.ctrls .zoom{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding:0 6px; min-width:44px; text-align:center}
.legend{
  position:absolute; left:14px; bottom:14px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:9px 12px; box-shadow:var(--shadow); font-size:12px; color:var(--muted);
  display:flex; flex-direction:column; gap:5px; max-width:260px;
}
.legend .li{display:flex; align-items:center; gap:7px}
.legend .sw{width:14px;height:10px;border-radius:2px;flex:none}
.hint{position:absolute; right:14px; bottom:14px; font-size:11.5px; color:var(--faint); font-family:var(--mono)}

.inspector{
  border-left:1px solid var(--line); background:var(--surface); overflow-y:auto;
  min-width:0; display:flex; flex-direction:column;
}
.insp-head{
  position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--line-soft);
  padding:14px 16px 12px; display:flex; align-items:flex-start; gap:10px; z-index:2;
}
.insp-head h3{font-family:var(--serif); font-size:16px; margin:0; line-height:1.3}
.insp-body{padding:14px 16px 40px; display:flex; flex-direction:column; gap:16px}
.insp-sec > .eyebrow{margin-bottom:6px}
.close{border:0;background:transparent;color:var(--faint);font-size:20px;line-height:1;cursor:pointer;padding:0 2px;margin-left:auto}
.close:hover{color:var(--ink)}

/* change rows */
.chg{
  border:1px solid var(--line-soft); border-radius:6px; padding:9px 11px; background:var(--surface-2);
  display:flex; flex-direction:column; gap:5px;
}
.chg .top{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12.5px}
.chg .who{font-weight:650}
.chg .arrow{
  display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11.5px; flex-wrap:wrap;
}
.chg .from{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--faint)}
.chg .to{color:var(--ink); background:var(--heat-soft); color:var(--heat-ink); padding:1px 5px; border-radius:3px}
.chg .ptr{font-family:var(--mono); font-size:11px; color:var(--faint); word-break:break-all}
.mag{height:3px; background:var(--sunken); border-radius:2px; overflow:hidden}
.mag i{display:block; height:100%; background:var(--heat)}

/* beats */
.beat{display:grid; grid-template-columns:26px 1fr; gap:10px; padding:11px 0; border-top:1px solid var(--line-soft)}
.beat:first-of-type{border-top:0}
.beat .no{
  font-family:var(--mono); font-size:11px; font-weight:700; color:var(--faint);
  background:var(--surface-2); border-radius:4px; height:22px; display:grid; place-items:center;
}
.beat .tx{font-size:13.5px; line-height:1.5; color:var(--ink-2)}
.beat .meta{display:flex; gap:6px; align-items:center; margin-bottom:5px; flex-wrap:wrap}

/* cast */
.cast{display:grid; grid-template-columns:250px 1fr; height:100%; min-height:0}
.cast-list{border-right:1px solid var(--line); overflow-y:auto; background:var(--surface); padding:10px}
.cast-group{margin-bottom:6px}
.cast-group > .eyebrow{padding:8px 10px 4px; margin:0}
.cast-list button{
  display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--ink-2);
  font:inherit; font-size:13.5px; padding:7px 10px; border-radius:6px; cursor:pointer; line-height:1.35;
}
.cast-list button:hover{background:var(--surface-2); color:var(--ink)}
.cast-list button[aria-current="true"]{background:var(--sunken); color:var(--ink); font-weight:600}
.cast-list .cid{font-family:var(--mono); font-size:10.5px; color:var(--faint); display:block}
.cast-detail{overflow-y:auto; min-width:0}

.sentences{display:flex; flex-direction:column; gap:0}
.sentence{
  display:grid; grid-template-columns:auto 1fr; gap:12px; padding:7px 0;
  border-top:1px solid var(--line-soft); align-items:baseline;
}
.sentence:first-child{border-top:0}
.sentence .ptr{
  font-family:var(--mono); font-size:10.5px; color:var(--faint); white-space:nowrap;
  cursor:copy; border-bottom:1px dotted var(--line);
}
.sentence .ptr:hover{color:var(--quench); border-color:var(--quench)}
.sentence .tx{font-size:14px; color:var(--ink-2)}
.sentence .when{font-size:11px; color:var(--faint); font-family:var(--mono)}

table.data{width:100%; border-collapse:collapse; font-size:13px}
table.data th{
  text-align:left; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint);
  font-weight:700; padding:6px 10px 6px 0; border-bottom:1px solid var(--line);
}
table.data td{padding:7px 10px 7px 0; border-bottom:1px solid var(--line-soft); vertical-align:top}
table.data tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* script */
.script-wrap{background:var(--surface); min-height:100%}
.script{
  max-width:64ch; margin:0 auto; padding:44px 24px 90px;
  font-family:var(--script); font-size:14.5px; line-height:1.42; color:var(--ink);
  white-space:pre-wrap; word-wrap:break-word;
}
.script .slug{font-weight:700; margin:26px 0 10px; letter-spacing:.02em}
.script .slug:first-child{margin-top:0}
.script .action{margin:0 0 11px; white-space:pre-wrap}
.script .cue{margin:11px 0 0; padding-left:36%; font-weight:700; letter-spacing:.03em}
.script .paren{margin:0; padding-left:28%}
.script .dlg{margin:0 0 2px; padding-left:18%; padding-right:14%}
.script .scenehead{
  font-family:var(--sans); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); border-top:1px solid var(--line-soft); padding-top:18px; margin:38px 0 14px; font-weight:700;
}
.script .scenehead:first-child{margin-top:0; border-top:0; padding-top:0}

/* state scrubber */
.scrub{display:flex; align-items:center; gap:14px; padding:14px 18px; background:var(--surface);
  border:1px solid var(--line-soft); border-radius:var(--radius); flex-wrap:wrap}
.scrub input[type=range]{flex:1; min-width:220px; accent-color:var(--heat)}
.scrub .marker{font-family:var(--mono); font-size:12.5px; color:var(--ink); min-width:190px}
.scrub .marker b{color:var(--heat)}
.statecell{font-family:var(--mono); font-size:12px}
.statecell.changed{background:var(--heat-soft); color:var(--heat-ink); padding:1px 6px; border-radius:3px}

/* plot embedding */
.emb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:14px}
.emb-row{display:grid;grid-template-columns:150px 1fr 20px;align-items:center;gap:9px;padding:2.5px 0}
.emb-row .k{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emb-row .k[title]{cursor:help}
.emb-pips{display:flex;gap:2.5px}
.emb-pips i{flex:1;height:9px;border-radius:2px;background:var(--sunken)}
.emb-pips i.on{background:var(--quench)}
.emb-pips i.hot{background:var(--heat)}
.emb-row .n{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.emb-row.zero .k{color:var(--faint)}
.emb-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.emb-legend{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.dominant{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.dom{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;
  padding:10px 13px;border-radius:7px;background:var(--heat-soft)}
.dom .score{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--heat-ink);line-height:1}
.dom .nm{font-weight:650;color:var(--heat-ink);font-size:14px}
.dom .ev{font-size:12.5px;color:var(--heat-ink);opacity:.85;margin-top:2px}

/* transitions */
.tr-pick{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:20px}
.tr-block{
  border:1px solid var(--line-soft); border-radius:var(--radius); background:var(--surface);
  margin-bottom:14px; overflow:hidden;
}
.tr-block > summary{
  padding:12px 16px; cursor:pointer; font-weight:650; font-size:14px; list-style:none;
  display:flex; align-items:center; gap:10px; background:var(--surface-2);
}
.tr-block > summary::-webkit-details-marker{display:none}
.tr-block > summary::before{
  content:"▸"; color:var(--faint); font-size:11px; transition:transform .12s; display:inline-block;
}
.tr-block[open] > summary::before{transform:rotate(90deg)}
.tr-block > summary:hover{background:var(--sunken)}
.tr-block .body{padding:16px 18px 20px; border-top:1px solid var(--line-soft)}
.tr-field{margin-bottom:14px}
.tr-field:last-child{margin-bottom:0}
.tr-field > .eyebrow{margin-bottom:4px}
.tr-field .txt{font-size:14px; line-height:1.6; color:var(--ink-2)}
.tom{display:grid; gap:0; border:1px solid var(--line-soft); border-radius:6px; overflow:hidden}
.tom .lvl{display:grid; grid-template-columns:38px 1fr; border-top:1px solid var(--line-soft)}
.tom .lvl:first-child{border-top:0}
.tom .d{
  font-family:var(--mono); font-size:10px; font-weight:700; color:var(--quench-ink);
  background:var(--quench-soft); display:grid; place-items:center; padding:8px 0; align-content:center;
}
.tom .lvl.err .d{background:var(--heat-soft); color:var(--heat-ink)}
.tom .c{padding:9px 12px; font-size:13.5px; line-height:1.55; color:var(--ink-2)}
.phases{display:flex; flex-direction:column; gap:0; counter-reset:ph}
.phase{
  display:grid; grid-template-columns:20px 1fr; gap:12px; padding:11px 0;
  border-top:1px solid var(--line-soft);
}
.phase:first-child{border-top:0}
.phase .rail{position:relative}
.phase .rail::before{
  content:""; position:absolute; left:8px; top:6px; bottom:-11px; width:1px; background:var(--line);
}
.phase:last-child .rail::before{display:none}
.phase .dot{
  width:9px;height:9px;border-radius:50%;background:var(--heat);
  position:absolute;left:4px;top:5px;box-shadow:0 0 0 3px var(--surface);
}
.phase h4{font-family:var(--sans); font-size:13.5px; font-weight:650; margin:0 0 3px}
.phase .shift{font-size:13.5px; color:var(--ink-2); line-height:1.55}
.phase .trig{font-size:12.5px; color:var(--muted); margin-top:4px}
.phase .trig b{color:var(--faint); font-weight:600; font-size:11px; letter-spacing:.05em; text-transform:uppercase}
.senses{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px}
.sense{border-left:2px solid var(--quench); padding:2px 0 2px 10px}
.sense .lbl{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:700}
.sense .v{font-size:13px; color:var(--ink-2); line-height:1.5}
.fe{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fe > div{padding:10px 12px; border-radius:6px}
.fe .felt{background:var(--quench-soft)} .fe .expr{background:var(--heat-soft)}
.fe .lbl{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; margin-bottom:4px}
.fe .felt .lbl{color:var(--quench-ink)} .fe .expr .lbl{color:var(--heat-ink)}
.fe .v{font-size:13px; line-height:1.5}
.fe .felt .v{color:var(--quench-ink)} .fe .expr .v{color:var(--heat-ink)}
.scorebar{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0}
.scorebar .s{
  font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:4px;
  background:var(--surface-2); border:1px solid var(--line-soft); color:var(--muted);
}
.scorebar .s b{color:var(--ink); font-weight:700}
.opt{border-left:2px solid var(--line); padding:4px 0 4px 11px; margin-bottom:9px}
.opt .o{font-size:13.5px; color:var(--ink); font-weight:600}
.opt .p{font-size:12.5px; color:var(--muted); margin:2px 0 0}
@media (max-width:700px){ .fe{grid-template-columns:1fr} }


/* ============================================================ chat dock */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--surface); border-top:1px solid var(--line);
  box-shadow:0 -8px 30px -18px rgba(0,0,0,.45);
  display:grid; grid-template-rows:auto 0fr;
}
.dock.open{grid-template-rows:auto minmax(0,1fr); height:min(60vh,560px)}
.dock-bar{
  display:flex; align-items:center; gap:12px; padding:0 16px; height:46px;
  cursor:pointer; user-select:none;
}
.dock-bar:hover{background:var(--surface-2)}
.dock-bar .title{font-weight:650; font-size:14px; display:flex; align-items:center; gap:9px}
.dock-bar .dotlive{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dock-bar .dotlive.ready{background:var(--good)}
.dock-bar .dotlive.busy{background:var(--heat)}
.dock-bar .sub{font-size:12px;color:var(--faint);font-family:var(--mono)}
.dock-body{display:grid; grid-template-columns:minmax(0,1fr); overflow:hidden; min-height:0}
.dock.settings-open .dock-body{grid-template-columns:minmax(0,1fr) 340px}
.chat{display:flex; flex-direction:column; min-height:0; border-top:1px solid var(--line-soft)}
.log{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.msg{display:grid; grid-template-columns:26px 1fr; gap:11px; align-items:start}
.msg .who{
  width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
  font-size:10px;font-weight:700;font-family:var(--mono);
}
.msg.user .who{background:var(--quench-soft); color:var(--quench-ink)}
.msg.bot .who{background:var(--heat-soft); color:var(--heat-ink)}
.msg.sys .who{background:var(--surface-2); color:var(--faint)}
.msg .body{font-size:14px; line-height:1.6; min-width:0; white-space:pre-wrap; word-wrap:break-word}
.msg.sys .body{font-size:12.5px; color:var(--muted)}
.msg .body p{margin:0 0 8px}
.tool{
  border:1px solid var(--line-soft); border-radius:6px; background:var(--surface-2);
  padding:7px 10px; font-size:12.5px; display:flex; align-items:baseline; gap:8px;
  flex-wrap:wrap; margin-top:6px;
}
.tool code{font-family:var(--mono); font-size:11.5px; background:transparent; border:0; padding:0;
  color:var(--heat-ink); font-weight:650}
.tool .arg{font-family:var(--mono); font-size:11px; color:var(--muted); word-break:break-all}
.tool .res{font-size:11.5px; color:var(--good); margin-left:auto; white-space:nowrap}
.tool .res.bad{color:var(--crit)}
.tool .jump{margin-left:6px}
.composer{border-top:1px solid var(--line-soft); padding:11px 14px; display:flex; gap:9px; align-items:flex-end}
.composer textarea{
  flex:1; min-height:40px; max-height:150px; resize:none; border-radius:8px; padding:10px 12px;
  font-family:var(--sans); font-size:14px; background:var(--ground); border:1px solid var(--line);
}
.composer textarea:focus{outline:2px solid var(--heat); outline-offset:-1px; border-color:transparent}
.chips{display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 10px}
.chip{
  font-size:12px; padding:4px 10px; border-radius:20px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2); cursor:pointer;
}
.chip:hover{background:var(--sunken); border-color:var(--faint)}
.settings{border-left:1px solid var(--line); border-top:1px solid var(--line-soft);
  padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:13px; background:var(--surface-2)}
.settings label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); font-weight:700; margin-bottom:5px}
.settings input{width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-family:var(--mono); font-size:12.5px}
.settings .hint{font-size:11.5px; color:var(--faint); line-height:1.5}
.settings .warn{font-size:11.5px; color:var(--warn); line-height:1.5}
@media (max-width:980px){
  .dock.settings-open .dock-body{grid-template-columns:minmax(0,1fr)}
  .dock.settings-open .settings{display:none}
  .dock.open{height:min(72vh,520px)}
}

/* data tab */
textarea{
  width:100%; min-height:230px; font-family:var(--mono); font-size:12px; line-height:1.5;
  background:var(--sunken); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; resize:vertical;
}
.note{font-size:13px; color:var(--muted)}
.ok{color:var(--good)} .bad{color:var(--crit)}
input[type=file]{font:inherit; font-size:13px; color:var(--muted)}

@media (max-width:980px){
  .app{grid-template-columns:1fr; height:auto; overflow:visible}
  .rail{flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
  .brand{border-bottom:0; border-right:1px solid var(--line-soft); flex:none}
  .nav{flex-direction:row; padding:8px}
  .nav button{grid-template-columns:1fr; white-space:nowrap}
  .rail-foot{display:none}
  /* Stacked below the canvas. The row is a FIXED height, never `auto` —
     an auto row grows with the panel's content, which pushes the page down
     every time a node is selected. */
  .graphwrap{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) 46vh;
    height:calc(100vh - 54px); width:100%}
  .graphwrap.collapsed{grid-template-rows:minmax(0,1fr) 0}
  .graphwrap.collapsed .inspector{display:none}
  .inspector{border-left:0; border-top:1px solid var(--line)}
  .cast{grid-template-columns:1fr; height:auto}
  .canvas-area{min-height:0}
}

<script>
"use strict";
const DATA = /*__DATA__*/{};

/* ============================================================ helpers */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const clone = o => JSON.parse(JSON.stringify(o));
const fmtVal = v => v===null?"null":typeof v==="string"?v:JSON.stringify(v);

/* ---- RFC 6902, the subset the schema emits ---- */
function ptrTokens(p){ return p===""?[]:p.split("/").slice(1).map(t=>t.replace(/~1/g,"/").replace(/~0/g,"~")); }
function ptrGet(doc,p){ let n=doc; for(const t of ptrTokens(p)){ if(n==null)return undefined; n=Array.isArray(n)?n[+t]:n[t]; } return n; }
function ptrSet(doc,p,v,remove){
  const t=ptrTokens(p); if(!t.length)return; let n=doc;
  for(let i=0;i<t.length-1;i++){ if(n==null)return; n=Array.isArray(n)?n[+t[i]]:n[t[i]]; }
  if(n==null)return; const k=t[t.length-1];
  if(Array.isArray(n)){ const i=k==="-"?n.length:+k; if(remove)n.splice(i,1); else n[i]=v; }
  else { if(remove)delete n[k]; else n[k]=v; }
}
function applyOps(doc,ops){
  const d=clone(doc);
  for(const op of ops||[]){
    if(op.op==="remove") ptrSet(d,op.path,null,true);
    else if(op.op==="add"||op.op==="replace") ptrSet(d,op.path,clone(op.value));
    else if(op.op==="copy") ptrSet(d,op.path,clone(ptrGet(d,op.from)));
    else if(op.op==="move"){ const v=clone(ptrGet(d,op.from)); ptrSet(d,op.from,null,true); ptrSet(d,op.path,v); }
  }
  return d;
}

/* ============================================================ model */
let M = null;
let RAW = null;          // the mutable bundle; M is always derived from it

/* Every mutation edits RAW and then commits. Rebuilding the model is cheap at
   this scale and it keeps the fold, the orders and the derived patch views from
   ever disagreeing with the data they came from. */
function commit(opts){
  const o=opts||{};
  M=buildModel(RAW);
  boot();
  if(!o.quiet) go(o.view||current);
}

function buildModel(data){
  const root = data.story_root||{}, expose = data.expose||{};
  const plots = {}; ((data.plots||{}).plots||[]).forEach(p=>plots[p.plot_id]=p);
  const entities = (data.entities||{}).entities||{};
  const events = (data.events||{}).events||{};
  const scenes = (data.scenes||{}).scenes||{};
  const prose = data.prose||{};
  const trans = data.transitions||{};

  const eventOrder = Object.keys(events).sort((a,b)=>(events[a].story_time?.index||0)-(events[b].story_time?.index||0));
  const sceneOrder = Object.keys(scenes).sort((a,b)=>(scenes[a].discourse_index||0)-(scenes[b].discourse_index||0));

  // beat sequence in story time — the canonical fold order
  const beats=[];
  for(const sid of Object.keys(scenes)){
    const sc=scenes[sid];
    for(const b of sc.beats||[]){
      const ev=events[b.event_id]||{};
      beats.push({sid, key:sid+"#b"+b.beat, eid:b.event_id, no:b.beat, beat:b,
                  story:ev.story_time?.index??1e6, disc:sc.discourse_index||0});
    }
  }
  beats.sort((a,b)=>a.story-b.story||a.disc-b.disc||a.no-b.no);

  // fold
  const t0 = clone(entities);
  const before={}, after={}; let cur=t0;
  for(const b of beats){
    before[b.key]=cur;
    const ops=(b.beat.changes||[]).map(c=>c.op).filter(Boolean);
    cur = ops.length?applyOps(cur,ops):cur;
    after[b.key]=cur;
  }
  const final=cur;

  const plotOf = pid => plots[pid];
  const isPrimaryPlot = (pid,i) => Object.keys(plots).indexOf(pid)===i;

  return {root,expose,plots,entities,events,scenes,prose,transitions:trans,eventOrder,sceneOrder,beats,t0,before,after,final,
    plotIds:Object.keys(plots).sort(),
    stateEnteringScene(sid){ const f=this.beats.find(b=>b.sid===sid); return f?this.before[f.key]:this.t0; },
    stateLeavingScene(sid){ const l=[...this.beats].reverse().find(b=>b.sid===sid); return l?this.after[l.key]:this.t0; },
    stateAfterEvent(eid){ const l=[...this.beats].reverse().find(b=>b.eid===eid); return l?this.after[l.key]:this.t0; },
    stateBeforeEvent(eid){ const f=this.beats.find(b=>b.eid===eid); return f?this.before[f.key]:this.t0; },
    scenePatch(sid){ return this.beats.filter(b=>b.sid===sid).sort((a,b)=>a.no-b.no)
                      .flatMap(b=>(b.beat.changes||[]).map(c=>c.op)); },
    eventPatch(eid){ return this.beats.filter(b=>b.eid===eid).flatMap(b=>(b.beat.changes||[]).map(c=>c.op)); },
    name(id){ return (this.entities[id]||{}).canonical_name || id; },
  };
}
/* plot colour: first plot = heat, second = quench, then alternating */
function plotColor(pid){
  const i = M.plotIds.indexOf(pid);
  return i<=0 ? "heat" : i===1 ? "quench" : (i%2 ? "quench" : "heat");
}
function plotVar(pid,which){ return `var(--${plotColor(pid)}${which||""})`; }

/* ============================================================ views */
const VIEWS=[
  {id:"root",   layer:"L0·L1", label:"Story root",  title:"Story root",         render:vRoot},
  {id:"expose", layer:"L2",    label:"Exposé",      title:"Exposé",             render:vExpose},
  {id:"plots",  layer:"L4",    label:"Plots",       title:"Plot decomposition", render:vPlots},
  {id:"cast",   layer:"L3",    label:"Cast",        title:"Entity dossiers",    render:vCast},
  {id:"events", layer:"L5",    label:"Event graph", title:"Event chain",        render:vEvents, full:true},
  {id:"scenes", layer:"L6",    label:"Scenes",      title:"Scene definitions",  render:vScenes, full:true},
  {id:"state",  layer:"fold",  label:"State",       title:"World state",        render:vState},
  {id:"reason", layer:"trans", label:"Reasoning",   title:"Transitions",        render:vTransitions},
  {id:"script", layer:"T6",    label:"Screenplay",  title:"Screenplay",         render:vScript},
  {id:"data",   layer:"i/o",   label:"Data",        title:"Import & export",    render:vData},
];

let current="root";
function nav(){
  const n=$("#nav"); n.innerHTML="";
  for(const v of VIEWS){
    const b=el("button"); b.setAttribute("aria-current",String(v.id===current));
    b.append(el("span","layer",v.layer), el("span",null,v.label));
    b.onclick=()=>go(v.id); n.append(b);
  }
}
function go(id){
  current=id; const v=VIEWS.find(x=>x.id===id);
  nav();
  $("#viewTitle").textContent=v.title;
  $("#viewCrumb").textContent=v.layer;
  const view=$("#view"); view.innerHTML=""; view.scrollTop=0;
  view.style.overflow = v.full ? "hidden" : "auto";
  view.style.display  = v.full ? "flex"   : "block";
  v.render(view);
  try{ location.hash=id; }catch(e){}
}

/* ------------------------------------------------------------ L0/L1 */
function vRoot(view){
  const r=M.root, pad=el("div","pad"); view.append(pad);
  if(!r.title){ pad.append(el("p","empty","No story root loaded.")); return; }

  const head=el("div","stack");
  head.append(el("div","eyebrow","Logline"));
  const l=el("p","lede",r.logline||""); head.append(l);
  pad.append(head);

  const facts=el("div","grid g3"); facts.style.marginTop="22px";
  const F=(k,v)=>{const c=el("div","card"); c.append(el("div","eyebrow",k), el("div",null,v||"—")); return c;};
  facts.append(
    F("Form", (r.form||"")+" · "+(r.language||"")),
    F("Genre", [r.genre_primary,...(r.genre_secondary||[])].filter(Boolean).join(", ")),
    F("Audience", (r.audience?.age_band||"")+" · "+(r.audience?.reading_level||"")),
    F("Point of view", (r.pov?.person||"")+", "+(r.pov?.tense||"")),
    F("Setting", (r.setting?.period||"")+" · "+(r.setting?.world_type||"")),
    F("Register", (r.style?.register||"")+" · dialogue "+Math.round((r.style?.dialogue_ratio||0)*100)+"%"),
  );
  pad.append(facts);

  if(r.premise){ pad.append(el("h2","sec","Premise")); const p=el("div","card prose-w"); p.append(el("p",null,r.premise)); pad.append(p); }

  if(r.audience?.reader_promise){
    const c=el("div","card"); c.style.marginTop="14px";
    c.append(el("div","eyebrow","Reader promise"), el("p",null,r.audience.reader_promise)); pad.append(c);
  }

  // plot embedding — the fixed 76-key coordinate system
  if(r.plot_embedding) pad.append(...renderEmbedding(r.plot_embedding));

  // narrative vector (legacy runs only)
  const nv=r.narrative_vector||{};
  if(Object.keys(nv).length){
    pad.append(el("h2","sec","Narrative vector"));
    pad.append(el("p","note prose-w","Each dimension is scored 0–100 with a stated purpose. Modal dimensions are bipolar: 0 is the first pole named, 100 the second. Hover a name to read why it sits where it does."));
    const g=el("div","grid g2"); g.style.marginTop="14px";
    for(const [group,dims] of Object.entries(nv)){
      const c=el("div","card"); c.append(el("div","eyebrow",group));
      const entries=Object.entries(dims).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
      for(const [dim,d] of entries){
        const m=el("div","meter");
        const nm=el("div","nm",dim.replace(/_/g," ")); if(d.intent)nm.title=d.intent;
        const tr=el("div","track"), fi=el("i"); const f=el("div","fill"+((d.score||0)>=60?" hot":""));
        f.style.width=Math.max(1.5,(d.score||0))+"%"; tr.append(f);
        m.append(nm,tr,el("div","val",String(d.score??"")));
        c.append(m);
      }
      g.append(c);
    }
    pad.append(g);
  }

  const rules=r.setting?.rules_of_the_world||[];
  if(rules.length){
    pad.append(el("h2","sec","Rules of the world"));
    pad.append(el("p","note prose-w","Hard constraints. No layer below this one may violate them — which is what makes the ending feel earned rather than convenient."));
    const c=el("div","card prose-w"); c.style.marginTop="12px";
    const ol=el("ol"); ol.style.margin="0"; ol.style.paddingLeft="20px";
    rules.forEach(x=>{const li=el("li",null,x); li.style.marginBottom="7px"; ol.append(li);});
    c.append(ol); pad.append(c);
  }
  const keep=r.keep_in_mind||[];
  if(keep.length){
    pad.append(el("h2","sec","Standing notes"));
    const c=el("div","card prose-w");
    const ul=el("ul"); ul.style.margin="0"; ul.style.paddingLeft="20px";
    keep.forEach(x=>{const li=el("li",null,x); li.style.marginBottom="7px"; ul.append(li);});
    c.append(ul); pad.append(c);
  }
  const tics=r.style?.forbidden_tics||[];
  if(tics.length){
    pad.append(el("h2","sec","Forbidden tics"));
    pad.append(el("p","note prose-w","Written at the root so the prose layer, hundreds of decisions later, still has them."));
    const t=el("div","tags"); t.style.marginTop="12px";
    tics.forEach(x=>t.append(el("span","tag",x))); pad.append(t);
  }
}

function renderEmbedding(emb){
  const out=[];
  out.push(el("h2","sec","Plot embedding"));
  const g=emb.genres||{}, d=emb.dimensions||{};
  const nonzero=Object.values(g).filter(v=>(v.score||0)>0).length;
  const mass=Object.values(g).reduce((n,v)=>n+(v.score||0),0);
  const note=el("p","note prose-w",
    `Every work in the corpus is scored on the same 52 genres and 24 dimensions, 0–5: `+
    `0 absent · 1 trace · 2 minor · 3 moderate · 4 strong · 5 defining. The scale measures `+
    `structural consequence, not presence — a chase that changes nothing is a 1. `+
    `This work scores non-zero on ${nonzero} of 52 genres (mass ${mass}) and is rated ${emb.age_rating||"—"}.`);
  out.push(note);

  // dominant genres
  const dom=(emb.dominant||[]).filter(k=>g[k]);
  if(dom.length){
    const box=el("div","dominant");
    dom.forEach(k=>{
      const row=el("div","dom");
      row.append(el("div","score",String(g[k].score)));
      const b=el("div");
      b.append(el("div","nm",k.replace(/_/g," ")));
      if(g[k].evidence) b.append(el("div","ev",g[k].evidence));
      row.append(b); box.append(row);
    });
    out.push(box);
  }

  const block=(title,data,onlyNonZero)=>{
    const card=el("div","card");
    const head=el("div","emb-head");
    head.append(el("div","eyebrow",title));
    head.append(el("span","emb-legend","0 ─ 5"));
    card.append(head);
    const entries=Object.entries(data)
      .filter(([,v])=>!onlyNonZero||(v.score||0)>0)
      .sort((a,b)=>(b[1].score||0)-(a[1].score||0)||a[0].localeCompare(b[0]));
    for(const [k,v] of entries){
      const sc=v.score||0;
      const row=el("div","emb-row"+(sc?"":" zero"));
      const nm=el("div","k",k.replace(/_/g," "));
      if(v.evidence) nm.title=v.evidence;
      const pips=el("div","emb-pips");
      for(let i=1;i<=5;i++){
        const p=el("i"); if(i<=sc) p.className = sc>=4?"hot":"on"; pips.append(p);
      }
      row.append(nm,pips,el("div","n",String(sc)));
      card.append(row);
    }
    return card;
  };

  const grid=el("div","emb-grid");
  grid.append(block("genres that score (of 52)",g,true));

function plotSwimlanes(){
  const ids=M.plotIds;
  const NS="http://www.w3.org/2000/svg";
  const laneH=118, padL=132, stepW=132, top=46;
  const maxSteps=Math.max(...ids.map(p=>Object.keys(M.plots[p].spine||{}).length),1);
  const W=padL+maxSteps*stepW+40, H=top+ids.length*laneH+30;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.style.display="block"; svg.style.minWidth=W+"px";

  const mk=(t,a)=>{const n=document.createElementNS(NS,t); for(const k in a)n.setAttribute(k,a[k]); return n;};
  const defs=mk("defs");
  ["heat","quench"].forEach(c=>{
    const m=mk("marker",{id:"ah-"+c,viewBox:"0 0 8 8",refX:7,refY:4,markerWidth:6,markerHeight:6,orient:"auto"});
    m.append(mk("path",{d:"M0,0 L8,4 L0,8 z",fill:`var(--${c})`})); defs.append(m);
  });
  svg.append(defs);

  const pos={}; // pid:key -> {x,y}
  ids.forEach((pid,li)=>{
    const y=top+li*laneH+34, col=plotColor(pid);
    svg.append(mk("line",{x1:8,y1:y+22,x2:W-20,y2:y+22,stroke:"var(--line-soft)","stroke-width":1}));
    const lab=mk("text",{x:10,y:y-6,fill:`var(--${col})`,"font-size":11,"font-weight":700,"font-family":"var(--mono)"});
    lab.textContent=pid+" · "+(M.plots[pid].type||""); svg.append(lab);
    const t2=mk("text",{x:10,y:y+12,fill:"var(--ink-2)","font-size":12,"font-family":"var(--sans)"});
    const ttl=M.plots[pid].title||""; t2.textContent=ttl.length>16?ttl.slice(0,15)+"…":ttl;
    if(ttl.length>16){const ti=mk("title"); ti.textContent=ttl; t2.append(ti);} svg.append(t2);

    const steps=Object.entries(M.plots[pid].spine||{}).sort((a,b)=>(a[1].step||0)-(b[1].step||0));
    steps.forEach(([k,s],i)=>{
      const x=padL+i*stepW, cy=y+22;
      pos[pid+":"+k]={x:x+52,y:cy};
      if(i>0) svg.append(mk("line",{x1:x-28,y1:cy,x2:x+2,y2:cy,stroke:`var(--${col})`,"stroke-width":1.6,"marker-end":`url(#ah-${col})`}));
      const isRes = M.plots[pid].resolution_step===k;
      const g=mk("g",{});
      g.append(mk("rect",{x:x+2,y:cy-19,width:104,height:38,rx:6,
        fill:`var(--${col}-soft)`,stroke:isRes?`var(--${col})`:"transparent","stroke-width":isRes?2:0}));
      const t=mk("text",{x:x+10,y:cy-5,"font-size":9.5,"font-weight":700,"font-family":"var(--mono)",fill:`var(--${col}-ink)`});
      t.textContent=k.toUpperCase(); g.append(t);
      const f=mk("text",{x:x+10,y:cy+9,"font-size":10.5,"font-family":"var(--sans)",fill:`var(--${col}-ink)`});
      const fn=(s.function||"").replace(/_/g," "); f.textContent=fn.length>15?fn.slice(0,14)+"…":fn;
      const ti=mk("title"); ti.textContent=(s.function||"")+(s.intent?" — "+s.intent:""); f.append(ti);
      g.append(f); svg.append(g);
    });
  });

  // cross-plot because arrows
  ids.forEach(pid=>{
    const steps=Object.entries(M.plots[pid].spine||{});
    steps.forEach(([k,s])=>{
      (s.because||[]).forEach(b=>{
        const [op,os]=b.split(":"); const from=pos[op+":"+os], to=pos[pid+":"+k];
        if(!from||!to||op===pid) return;
        const col=plotColor(op);
        const midY=(from.y+to.y)/2;
        const d=`M${from.x},${from.y+(to.y>from.y?19:-19)} C${from.x},${midY} ${to.x},${midY} ${to.x},${to.y+(to.y>from.y?-19:19)}`;
        svg.append(mk("path",{d,fill:"none",stroke:`var(--${col})`,"stroke-width":1.3,"stroke-dasharray":"4 3",
          opacity:.75,"marker-end":`url(#ah-${col})`}));
      });
    });
  });
  return svg;
}

      const c4=el("td"); const changed=JSON.stringify(start)!==JSON.stringify(end);

  // profile

  if(keys.length){
    pad.append(el("h2","sec","Dossier"));

      c.append(el("div","eyebrow",k.replace(/_/g," ")));
      c.append(renderProfileNode(prof[k],`/${id}/profile/${k}`));
      g.append(c);
    }
    pad.append(g);

  // relationships

    pad.append(el("h2","sec","Relationships"));

    for(const [other,rel] of Object.entries(rels)){
      const c=el("div","card");
      const hd=el("div"); hd.style.display="flex"; hd.style.alignItems="center"; hd.style.gap="10px"; hd.style.flexWrap="wrap";
      const nm=el("strong",null,M.name(other)); hd.append(nm);

    tb.append(body); const sc=el("div","scroll-x"); sc.append(tb); card.append(sc); pad.append(card);
  }

function renderProfileNode(node,ptr){
  if(node==null) return el("div","note","—");
  if(typeof node==="string") return el("p",null,node);
  if(Array.isArray(node)){ const t=el("div","tags"); node.forEach(x=>t.append(el("span","tag",typeof x==="string"?x:JSON.stringify(x)))); return t; }
  const entries=Object.entries(node);
  const isSentenceMap = entries.length>0 && entries.every(([,v])=>v&&typeof v==="object"&&typeof v.text==="string");
  if(isSentenceMap){
    const list=el("div","sentences");
    for(const [k,v] of entries){
      const row=el("div","sentence");
      const p=el("code","ptr",ptr+"/"+k); p.title="Click to copy this JSON Pointer"; p.onclick=()=>copy(ptr+"/"+k);
      const body=el("div"); body.append(el("div","tx",v.text));
      const meta=[]; if(v.when)meta.push(v.when); (v.tags||[]).forEach(t=>meta.push(t));
      if(meta.length) body.append(el("div","when",meta.join(" · ")));
      row.append(p,body); list.append(row);
    }
    return list;
  }
  const dl=el("dl","kv");
  for(const [k,v] of entries){
    dl.append(el("dt",null,k.replace(/_/g," ")));
    const dd=el("dd");
    if(typeof v==="string") dd.textContent=v;
    else dd.append(renderProfileNode(v,ptr+"/"+k));
    dl.append(dd);
  }
  return dl;
}

function entityHistory(id){
  const out=[]; const pre="/"+id+"/";
  for(const b of M.beats) for(const c of (b.beat.changes||[]))
    if((c.op?.path||"").startsWith(pre))
      out.push({scene:b.sid,beat:b.no,event:b.eid,variable:c.variable,before:c.before,after:c.after,
                dimension:c.dimension,magnitude:c.magnitude});
  return out;
}

  function togglePanel(){
    inspectorCollapsed = !inspectorCollapsed;
    wrap.classList.toggle("collapsed", inspectorCollapsed);
    syncToggle();
    resize(true);          // the only place the canvas box ever changes
  }
  syncToggle();
  if(legend){ const lg=el("div","legend"); legend.forEach(([c,t])=>{const li=el("div","li");
    const sw=el("span","sw"); sw.style.background=c; li.append(sw,el("span",null,t)); lg.append(li);}); area.append(lg); }
  if(hint) area.append(el("div","hint",hint));

  /* Reading getBoundingClientRect forces a synchronous layout, so this always
     sees the post-class-change width. Calling it in the same tick as the
     layout change is what keeps the bitmap and the CSS box the same size —
     defer it by even one frame and the browser paints the old, wider bitmap
     squeezed into the new narrower box, which reads as the panel animating in. */
  function resize(force){
    const r=area.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const w=Math.max(1,r.width), h=Math.max(1,r.height);
    if(!force && w===W && h===H) return;   // idempotent: no redundant repaint
    W=w; H=h;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  function fitAll(){
    if(!nodes.length) return;
    const pad=54;
    const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
    const w=Math.max(...xs.map((x,i)=>x+nodes[i].w))-Math.min(...xs);
    const h=Math.max(...ys.map((y,i)=>y+nodes[i].h))-Math.min(...ys);
    scale=Math.min((W-pad*2)/Math.max(w,1),(H-pad*2)/Math.max(h,1),1.6);
    ox=pad-Math.min(...xs)*scale+(W-pad*2-w*scale)/2;
    oy=pad-Math.min(...ys)*scale+(H-pad*2-h*scale)/2;
    draw();
  }
  function zoomBy(f,cx,cy){
    cx=cx??W/2; cy=cy??H/2;
    const ns=Math.max(.25,Math.min(3,scale*f));
    ox=cx-(cx-ox)*(ns/scale); oy=cy-(cy-oy)*(ns/scale); scale=ns; draw();
  }
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function draw(){
    zoomLbl.textContent=Math.round(scale*100)+"%";
    ctx.clearRect(0,0,W,H);
    ctx.save(); ctx.translate(ox,oy); ctx.scale(scale,scale);
    const C={line:css("--line"),ink:css("--ink"),ink2:css("--ink-2"),muted:css("--muted"),
             surface:css("--surface"),faint:css("--faint")};
    // edges
    for(const e of edges){
      const a=nodes[e.from], b=nodes[e.to]; if(!a||!b) continue;
      const on = sel!=null && (e.from===sel||e.to===sel);
      ctx.strokeStyle = on ? css("--"+(e.color||"heat")) : C.line;
      ctx.lineWidth = on ? 2/1 : 1.1;
      ctx.setLineDash(e.dashed?[5,4]:[]);
      const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
      const dx=Math.max(28,(x2-x1)/2);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.bezierCurveTo(x1+dx,y1,x2-dx,y2,x2,y2); ctx.stroke();
      // arrow head
      const ang=Math.atan2(y2-y1,dx); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x2,y2);
      ctx.lineTo(x2-8*Math.cos(ang-.4),y2-8*Math.sin(ang-.4));
      ctx.lineTo(x2-8*Math.cos(ang+.4),y2-8*Math.sin(ang+.4));
      ctx.closePath(); ctx.fillStyle=on?css("--"+(e.color||"heat")):C.line; ctx.fill();
    }
    ctx.setLineDash([]);
    // nodes
    nodes.forEach((n,i)=>{
      const active=i===sel, hot=i===hover;
      const accent=css("--"+(n.color||"heat"));
      ctx.fillStyle=active?css("--"+(n.color||"heat")+"-soft"):C.surface;
      ctx.strokeStyle=active?accent:(hot?css("--faint"):C.line);
      ctx.lineWidth=active?2:1;
      roundRect(ctx,n.x,n.y,n.w,n.h,7); ctx.fill(); ctx.stroke();
      // accent stripe
      ctx.fillStyle=accent; roundRect(ctx,n.x,n.y,3.5,n.h,2); ctx.fill();
      ctx.fillStyle=active?css("--"+(n.color||"heat")+"-ink"):C.faint;
      ctx.font="600 10px ui-monospace,Menlo,monospace";
      ctx.fillText(n.id,n.x+11,n.y+15);
      ctx.fillStyle=active?css("--"+(n.color||"heat")+"-ink"):C.ink2;
      ctx.font="12px system-ui,sans-serif";
      wrapText(ctx,n.label,n.x+11,n.y+31,n.w-20,14,3);
      if(n.badge){
        ctx.fillStyle=C.faint; ctx.font="9.5px ui-monospace,Menlo,monospace";
        ctx.fillText(n.badge,n.x+11,n.y+n.h-8);
      }
    });
    ctx.restore();
  }
  function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
  function wrapText(c,t,x,y,maxW,lh,maxLines){
    const words=String(t||"").split(/\s+/); let line="",n=0;
    for(const w of words){
      const test=line?line+" "+w:w;
      if(c.measureText(test).width>maxW&&line){
        c.fillText(line,x,y+n*lh); n++; line=w;
        if(n>=maxLines-1){ let last=line; while(c.measureText(last+"…").width>maxW&&last.length>1) last=last.slice(0,-1);
          c.fillText(last+(words.indexOf(w)<words.length-1?"…":""),x,y+n*lh); return; }
      } else line=test;
    }
    if(line) c.fillText(line,x,y+n*lh);
  }
  function hit(px,py){
    const x=(px-ox)/scale, y=(py-oy)/scale;
    for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];
      if(x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h) return i;}
    return null;
  }
  cv.addEventListener("pointerdown",ev=>{
    cv.setPointerCapture(ev.pointerId);
    drag={x:ev.offsetX,y:ev.offsetY,ox,oy,moved:false}; cv.classList.add("dragging");
  });
  cv.addEventListener("pointermove",ev=>{
    if(drag){
      const dx=ev.offsetX-drag.x, dy=ev.offsetY-drag.y;
      if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
      ox=drag.ox+dx; oy=drag.oy+dy; draw(); return;
    }
    const h=hit(ev.offsetX,ev.offsetY);
    if(h!==hover){hover=h; cv.style.cursor=h==null?"grab":"pointer"; draw();}
  });
  cv.addEventListener("pointerup",ev=>{
    cv.classList.remove("dragging");
    const wasDrag=drag&&drag.moved; drag=null;
    if(wasDrag) return;
    const h=hit(ev.offsetX,ev.offsetY);
    if(h!=null) select(h); else closePanel();
  });
  cv.addEventListener("pointercancel",()=>{drag=null;cv.classList.remove("dragging");});
  cv.addEventListener("wheel",ev=>{ev.preventDefault(); zoomBy(ev.deltaY<0?1.12:1/1.12,ev.offsetX,ev.offsetY);},{passive:false});

  function showEmpty(){
    insp.innerHTML="";
    const e=el("div","insp-empty");
    e.append(el("b",null,"Nothing selected"));
    e.append(document.createTextNode(emptyHint||"Click any node to read its details here."));
    insp.append(e);
  }
  function closePanel(){          // deselect — the panel stays exactly where it is
    sel=null; showEmpty(); draw();
  }
  function select(i){
    sel=i;
    insp.innerHTML="";
    onSelect(insp,nodes[i],closePanel);
    insp.scrollTop=0;
    if(inspectorCollapsed) togglePanel();   // an explicit click may reopen it
    draw();                                  // canvas size never changed
  }
  showEmpty();
  const ro=new ResizeObserver(()=>resize()); ro.observe(area);
  requestAnimationFrame(()=>{resize(true); if(fit!==false) fitAll();});
  return {selectById(id){
    const i=nodes.findIndex(n=>n.id===id);
    if(i<0) return;
    sel=i; insp.innerHTML=""; onSelect(insp,nodes[i],closePanel); insp.scrollTop=0;
    if(inspectorCollapsed) togglePanel();
    const n=nodes[i]; ox=W/2-(n.x+n.w/2)*scale; oy=H/2-(n.y+n.h/2)*scale;
    draw();
  }};
}

let eventsGraph=null;
function vEvents(view){
  const ids=M.eventOrder;
  if(!ids.length){ const p=el("div","pad"); p.append(el("p","empty","No events loaded.")); view.append(p); return; }

  // layered layout: column = story order, lane = primary plot
  const NW=178, NH=76, GAPX=62, GAPY=26;
  const lanes=M.plotIds;
  const nodes=ids.map((id,i)=>{
    const e=M.events[id];
    const lane=Math.max(0,lanes.indexOf(e.primary_plot));
    return {id, idx:i, lane,
      x:i*(NW+GAPX), y:lane*(NH+GAPY+34),
      w:NW, h:NH, color:plotColor(e.primary_plot),
      label:e.summary||"", badge:"t"+(e.story_time?.index??"")+" · "+(e.story_time?.label||""),
      ref:id};
  });
  const index={}; nodes.forEach((n,i)=>index[n.id]=i);
  const edges=[];
  ids.forEach(id=>{
    (M.events[id].causes||[]).forEach(to=>{
      if(index[to]!=null) edges.push({from:index[id],to:index[to],color:plotColor(M.events[id].primary_plot)});
    });
  });

  eventsGraph=makeGraph(view,{nodes,edges,legend:lanes.map(p=>[`var(--${plotColor(p)})`,p+" · "+(M.plots[p].title||"")]),
    hint:"drag to pan · scroll to zoom · click a node",
    emptyHint:"Click any event to read its participants, declared state changes, causality and the patch it produces.",
    onSelect:(host,node,close)=>renderEventInspector(host,node.id,close)});
}
function selectEvent(id){ eventsGraph&&eventsGraph.selectById(id); }

function renderEventInspector(host,eid,close){
  const e=M.events[eid];
  const head=el("div","insp-head");
  const hg=el("div");
  hg.append(el("div","eyebrow",eid+" · t"+(e.story_time?.index??"")));
  hg.append(el("h3",null,e.summary||eid));
  head.append(hg);
  const x=el("button","close","×"); x.onclick=close; x.title="Clear selection"; head.append(x);
  host.append(head);

  const b=el("div","insp-body"); host.append(b);
  const sec=(t)=>{const s=el("div","insp-sec"); s.append(el("div","eyebrow",t)); b.append(s); return s;};

  const meta=sec("Placement");
  const dl=el("dl","kv");
  const add=(k,v)=>{dl.append(el("dt",null,k),el("dd",null,v));};
  add("Story time",(e.story_time?.label||"")+(e.story_time?.duration_min?` · ${e.story_time.duration_min} min`:""));
  add("Location",M.name(e.location));
  add("Function",(e.plot_function||"").replace(/_/g," "));
  meta.append(dl);
  const tg=el("div","tags"); tg.style.marginTop="8px";
  (e.plots||[]).forEach(p=>{
    const t=el("span","tag "+plotColor(p),p+(p===e.primary_plot?" (parent)":""));
    tg.append(t);
  });
  if(e.reversal) tg.append(el("span","tag","reversal"));
  if(e.is_root) tg.append(el("span","tag","root"));
  if(e.is_sink) tg.append(el("span","tag","sink"));
  meta.append(tg);

  if((e.plot_bindings||[]).length){
    const s=sec("Discharges");
    const t=el("div","tags");
    e.plot_bindings.forEach(pb=>{
      const step=M.plots[pb.plot]?.spine?.[pb.step];
      const tag=el("span","tag "+plotColor(pb.plot),`${pb.plot}:${pb.step} ${step?("· "+(step.function||"").replace(/_/g," ")):""}`);
      t.append(tag);
    });
    s.append(t);
  }

  const who=sec("Participants");
  const wt=el("div","tags");
  (e.participants||[]).forEach(p=>{
    const t=el("span","tag",M.name(p)); t.style.cursor="pointer";
    t.onclick=()=>{castSel=p; go("cast");}; wt.append(t);
  });
  who.append(wt);

  if(e.action){ const s=sec("Action"); const p=el("p",null,e.action); p.style.fontSize="13.5px"; p.style.color="var(--ink-2)"; s.append(p); }

  const ch=sec("Declared state changes");
  ch.append(...(e.state_changes||[]).map(c=>changeCard(c)));
  if(!(e.state_changes||[]).length) ch.append(el("p","note","none"));

  if(e.causal_note){ const s=sec("Why now"); const p=el("p",null,e.causal_note); p.style.fontSize="13.5px"; p.style.color="var(--ink-2)"; s.append(p); }

  const cz=sec("Causality");
  const cg=el("div"); cg.style.display="grid"; cg.style.gap="8px";
  const line=(lbl,arr)=>{
    const d=el("div"); d.append(el("span","tag",lbl));
    const t=el("span"); t.style.marginLeft="6px";
    (arr||[]).forEach(id=>{const b2=el("button","btn sm",id); b2.style.marginRight="4px";
      b2.onclick=()=>selectEvent(id); t.append(b2);});
    if(!(arr||[]).length) t.append(el("span","note"," none"));
    d.append(t); return d;
  };
  cg.append(line("caused by",e.caused_by),line("causes",e.causes));
  cz.append(cg);

  const sc=sec("Realized in");
  const st=el("div","tags");
  M.sceneOrder.filter(sid=>(M.scenes[sid].events||[]).includes(eid)).forEach(sid=>{
    const t=el("button","btn sm",sid+(M.scenes[sid].primary_event===eid?" (parent)":""));
    t.onclick=()=>{go("scenes"); setTimeout(()=>selectScene(sid),40);}; st.append(t);
  });
  sc.append(st);

  if(M.transitions[eid]){
    const g=sec("Reasoning");
    const btn=el("button","btn","Read the transition that produced this event");
    btn.onclick=()=>{trTarget=eid; go("reason");};
    g.append(btn);
    const sb=el("div","scorebar");
    for(const [k,v] of Object.entries(trScore(M.transitions[eid]))){
      const x=el("span","s"); x.append(document.createTextNode(k+" "),el("b",null,String(v))); sb.append(x);
    }
    g.append(sb);
  }

  const ps=sec("Patch produced by this event");
  const pre=el("textarea"); pre.readOnly=true; pre.style.minHeight="120px";
  pre.value=JSON.stringify(M.eventPatch(eid),null,1); ps.append(pre);
}

function changeCard(c){
  const d=el("div","chg");
  const top=el("div","top");
  top.append(el("span","who",M.name(c.entity)));
  top.append(el("code","mono",c.variable||""));
  if(c.dimension) top.append(el("span","tag",c.dimension));
  d.append(top);
  const ar=el("div","arrow");
  ar.append(el("span","from",fmtVal(c.before)), el("span",null,"→"), el("span","to",fmtVal(c.after)));
  d.append(ar);
  if(c.op?.path) d.append(el("code","ptr",(c.op.op||"replace")+" "+c.op.path));
  if(c.magnitude!=null){ const m=el("div","mag"); const i=el("i"); i.style.width=c.magnitude+"%"; m.append(i); d.append(m); }
  return d;
}

/* ------------------------------------------------------------ L6 */
let scenesGraph=null;
function vScenes(view){
  const ids=M.sceneOrder;
  if(!ids.length){ const p=el("div","pad"); p.append(el("p","empty","No scenes loaded.")); view.append(p); return; }
  const NW=196, NH=84, GAPX=54;
  const nodes=ids.map((id,i)=>{
    const s=M.scenes[id];
    // vertical position tracks the tension curve — a scene high on the page is a scene under pressure
    const t=s.tension_out??50;
    return {id, x:i*(NW+GAPX), y:(100-t)*2.6, w:NW, h:NH,
      color:plotColor(s.primary_plot),
      label:s.dramatic_function||"",
      badge:`d${s.discourse_index} · ${(s.beats||[]).length} beats · tension ${s.tension_in}→${s.tension_out}`};
  });
  const edges=[]; for(let i=0;i<nodes.length-1;i++) edges.push({from:i,to:i+1,color:nodes[i].color});
  scenesGraph=makeGraph(view,{nodes,edges,
    legend:M.plotIds.map(p=>[`var(--${plotColor(p)})`,p+" · parent plot"]).concat([["transparent","height = tension out"]]),
    hint:"reading order left to right · height tracks tension",
    emptyHint:"Click any scene to read its beats, the patch operations they author, and the state across the scene.",
    onSelect:(host,node,close)=>renderSceneInspector(host,node.id,close)});
}
function selectScene(id){ scenesGraph&&scenesGraph.selectById(id); }

function renderSceneInspector(host,sid,close){
  const s=M.scenes[sid];
  const head=el("div","insp-head");
  const hg=el("div");
  hg.append(el("div","eyebrow",sid+" · scene "+s.discourse_index+(s.chapter?" · ch "+s.chapter:"")));
  hg.append(el("h3",null,s.dramatic_function||sid));
  head.append(hg);
  const x=el("button","close","×"); x.onclick=close; x.title="Clear selection"; head.append(x);
  host.append(head);

  const b=el("div","insp-body"); host.append(b);
  const sec=(t)=>{const q=el("div","insp-sec"); q.append(el("div","eyebrow",t)); b.append(q); return q;};

  const meta=sec("Placement");
  const dl=el("dl","kv"); const add=(k,v)=>{dl.append(el("dt",null,k),el("dd",null,v));};
  add("When",s.story_time_label||"—"); add("Where",M.name(s.location));
  add("POV",M.name(s.pov)); add("Mode",s.narrative_mode||"—");
  add("Tension",`${s.tension_in} → ${s.tension_out}`);
  add("Budget",(s.target_words||"—")+" words");
  meta.append(dl);
  const tg=el("div","tags"); tg.style.marginTop="8px";
  (s.plots||[]).forEach(p=>tg.append(el("span","tag "+plotColor(p),p+(p===s.primary_plot?" (parent)":""))));
  (s.events||[]).forEach(e=>{
    const t=el("button","btn sm",e+(e===s.primary_event?" (parent)":""));
    t.onclick=()=>{go("events"); setTimeout(()=>selectEvent(e),40);}; tg.append(t);
  });
  meta.append(tg);

  const pr=sec("Present");
  const pt=el("div","tags");
  (s.present||[]).forEach(p=>{const t=el("span","tag",M.name(p)); t.style.cursor="pointer";
    t.onclick=()=>{castSel=p; go("cast");}; pt.append(t);});
  (s.offstage_referenced||[]).forEach(p=>pt.append(el("span","tag",M.name(p)+" (offstage)")));
  pr.append(pt);

  const bs=sec("Beats");
  (s.beats||[]).forEach(bt=>{
    const row=el("div","beat");
    row.append(el("div","no",String(bt.beat)));
    const body=el("div");
    const mt=el("div","meta");
    mt.append(el("span","tag",bt.type||""));
    const evb=el("span","tag "+plotColor(M.events[bt.event_id]?.primary_plot),bt.event_id);
    evb.style.cursor="pointer"; evb.onclick=()=>{go("events"); setTimeout(()=>selectEvent(bt.event_id),40);};
    mt.append(evb);
    body.append(mt);
    body.append(el("div","tx",bt.text||""));
    if((bt.changes||[]).length){
      const cg=el("div"); cg.style.display="flex"; cg.style.flexDirection="column"; cg.style.gap="6px"; cg.style.marginTop="8px";
      bt.changes.forEach(c=>cg.append(changeCard(c)));
      body.append(cg);
    }
    row.append(body); bs.append(row);
  });

  // entry / exit
  const es=sec("State across the scene");
  const enter=M.stateEnteringScene(sid), leave=M.stateLeavingScene(sid);
  const involved=new Set([...(s.present||[]),...Object.keys(s.entry_states||{}),...Object.keys(s.exit_states||{})]);
  const tb=el("table","data"); const th=el("thead"),tr=el("tr");
  ["Entity","Variable","In","Out"].forEach(h=>tr.append(el("th",null,h)));
  th.append(tr); tb.append(th); const body=el("tbody");
  for(const id of involved){
    const vars=Object.keys((M.entities[id]||{}).state_variables||{});
    for(const v of vars){
      const a=(enter[id]?.state||{})[v], z=(leave[id]?.state||{})[v];
      if(a===undefined&&z===undefined) continue;
      const changed=JSON.stringify(a)!==JSON.stringify(z);
      if(!changed && !(s.entry_states?.[id]||{}).hasOwnProperty(v)) continue;
      const r=el("tr");
      r.append(el("td",null,M.name(id)));
      const c1=el("td"); c1.append(el("code","mono",v)); r.append(c1);
      const c2=el("td"); c2.append(el("span","statecell",fmtVal(a))); r.append(c2);
      const c3=el("td"); c3.append(el("span","statecell"+(changed?" changed":""),fmtVal(z))); r.append(c3);
      body.append(r);
    }
  }
  tb.append(body); const sx=el("div","scroll-x"); sx.append(tb); es.append(sx);

  const q=s.questions_opened||{};
  if(Object.keys(q).length||(s.questions_closed||[]).length){
    const qs=sec("Questions");
    for(const [k,v] of Object.entries(q)){ const d=el("div"); d.append(el("span","tag",k+" opened")," ",document.createTextNode(v)); d.style.marginBottom="6px"; qs.append(d); }
    (s.questions_closed||[]).forEach(k=>{const d=el("div"); d.append(el("span","tag",k+" closed")); qs.append(d);});
  }

  if(M.prose[sid]){
    const g=sec("Screenplay");
    const btn=el("button","btn","Read this scene");
    btn.onclick=()=>{scriptTarget=sid; go("script");};
    g.append(btn);
  }

  if(M.transitions[sid]){
    const g=sec("Reasoning");
    const btn=el("button","btn","Read the transition that produced this scene");
    btn.onclick=()=>{trTarget=sid; go("reason");};
    g.append(btn);
  }

  const ps=sec("Patch produced by this scene");
  const pre=el("textarea"); pre.readOnly=true; pre.style.minHeight="120px";
  pre.value=JSON.stringify(M.scenePatch(sid),null,1); ps.append(pre);
}

/* ------------------------------------------------------------ state fold */
function vState(view){
  const pad=el("div","pad"); view.append(pad);
  if(!M.beats.length){ pad.append(el("p","empty","No beats to fold.")); return; }

  pad.append(el("p","note prose-w","The world state at t0 is the entity layer, unmodified. Every state after it is reached by applying the patch operations authored by each beat, in story-time order. Drag the scrubber to fold the story forward and watch the world change. Values that moved at this step are highlighted."));

  const scrub=el("div","scrub"); scrub.style.marginTop="18px";
  const marker=el("div","marker");
  const range=el("input"); range.type="range"; range.min="0"; range.max=String(M.beats.length); range.value="0"; range.step="1";

    const i=+range.value;
    const b = i===0 ? null : M.beats[i-1];

    const prevWorld = b ? M.before[b.key] : M.t0;
    marker.innerHTML="";
    if(!b){ marker.append(document.createTextNode("t0 — "), el("b",null,"before anything happens")); }

        b.beat.changes.forEach(x=>g.append(changeCard(x))); c.append(g);
      } else c.append(el("p","note","No state change — a setup beat."));
      host.append(c);
    }
    const grid=el("div","grid g2");
    for(const id of Object.keys(M.entities)){
      const st=world[id]?.state||{}, ps=prevWorld[id]?.state||{};
      if(!Object.keys(st).length) continue;
      const c=el("div","card");
      const hd=el("div"); hd.style.display="flex"; hd.style.justifyContent="space-between"; hd.style.alignItems="baseline";
      hd.append(el("strong",null,M.name(id)),el("code","mono",id)); c.append(hd);
      const dl=el("dl","kv"); dl.style.marginTop="8px";
      for(const [k,v] of Object.entries(st)){
        dl.append(el("dt",null,k));
        const dd=el("dd");
        const changed=JSON.stringify(v)!==JSON.stringify(ps[k]);
        dd.append(el("span","statecell"+(changed?" changed":""),fmtVal(v)));
        dl.append(dd);
      }
      c.append(dl); grid.append(c);
    }
    host.append(grid);
  }
  range.oninput=render;
  prev.onclick=()=>{range.value=String(Math.max(0,+range.value-1)); render();};
  next.onclick=()=>{range.value=String(Math.min(M.beats.length,+range.value+1)); render();};
  end.onclick=()=>{range.value=String(M.beats.length); render();};
  render();
}

  // score strip

/* Classify screenplay lines by their indentation and shape. */
function formatScript(text){
  const out=[]; const lines=String(text||"").replace(/\r/g,"").split("\n");
  let buf=[], mode=null;
  const flush=()=>{ if(!buf.length)return; const t=buf.join("\n"); if(t.trim()) out.push(el("p",mode||"action",t)); buf=[]; };
  for(const raw of lines){
    const line=raw.replace(/\s+$/,"");
    if(!line.trim()){ flush(); mode=null; continue; }
    const indent=line.length-line.trimStart().length;
    const t=line.trim();
    let kind;
    if(/^(INT\.|EXT\.|INT\/EXT|I\/E)/i.test(t)) kind="slug";
    else if(/^\(.*\)$/.test(t)&&indent>=8) kind="paren";
    else if(indent>=14 && /^[A-Z0-9][A-Z0-9 .'’\-]*(\(.*\))?$/.test(t) && t.length<40) kind="cue";
    else if(indent>=6) kind="dlg";
    else kind="action";
    if(kind!==mode||kind==="slug"||kind==="cue"){ flush(); mode=kind; }
    buf.push(kind==="action"?t:t);
  }
  flush();
  return out;
}

function tryLoad(text,status){

    const d=JSON.parse(text);
    const next=buildModel(d);
    if(!next.root.title && !Object.keys(next.entities).length) throw new Error("no recognizable layers in this bundle");
    RAW=d; M=next; castSel=null;

async function copy(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.append(ta); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok; }
    catch(e2){ return false; }
  }
}

/* Configuration lives in localStorage, never in the page. Publishing a file
   with a key baked in would hand it to anyone holding the link. */
const CFG_DEFAULTS={base:"https://api.hyprlab.io/v1", key:"", model:"grok-4.6", temp:"0.8"};
function cfgGet(){
  const c={...CFG_DEFAULTS};
  try{ for(const k of Object.keys(CFG_DEFAULTS)){
    const v=localStorage.getItem("nf."+k); if(v!==null) c[k]=v; } }catch(e){}
  return c;
}
function cfgSet(c){ try{ for(const k in c) localStorage.setItem("nf."+k,c[k]); }catch(e){} }

/* ---- mutation helpers: every write goes through here ---- */
function ensure(path,init){ if(!RAW[path]) RAW[path]=init; return RAW[path]; }
function plotsArr(){ return ensure("plots",{plots:[]}).plots; }
function entMap(){ return ensure("entities",{entities:{}}).entities; }
function evMap(){ return ensure("events",{events:{}}).events; }
function scMap(){ return ensure("scenes",{scenes:{}}).scenes; }

function docFor(kind,id){
  if(kind==="story_root") return RAW.story_root;
  if(kind==="expose") return RAW.expose;
  if(kind==="plot") return plotsArr().find(p=>p.plot_id===id);
  if(kind==="entity") return entMap()[id];
  if(kind==="event") return evMap()[id];
  if(kind==="scene") return scMap()[id];
  if(kind==="prose") return RAW.prose[id];
  return undefined;
}

/* ---- a compact client-side validator, mirroring the server rules ---- */
function validateBundle(){
  const out=[];
  const ents=entMap(), evs=evMap(), scs=scMap();
  const plots={}; plotsArr().forEach(p=>plots[p.plot_id]=p);

  for(const [id,e] of Object.entries(ents)){
    const dec=e.state_variables||{}, st=e.state||{};
    for(const k in dec) if(!(k in st)) out.push(`${id}: declares ${k} but has no value in state`);
    for(const k in st) if(!(k in dec)) out.push(`${id}: state has ${k} which is not declared`);
  }
  for(const [id,ev] of Object.entries(evs)){
    if(!(ev.plots||[]).length) out.push(`${id}: serves no plot`);
    if(ev.primary_plot && !(ev.plots||[]).includes(ev.primary_plot))
      out.push(`${id}: primary_plot not among plots`);
    (ev.plots||[]).forEach(p=>{ if(plots[p]===undefined) out.push(`${id}: unknown plot ${p}`); });
    if(!(ev.state_changes||[]).length) out.push(`${id}: declares no state change`);
    (ev.state_changes||[]).forEach(c=>{
      const e=ents[c.entity];
      if(!e) out.push(`${id}: change on unknown entity ${c.entity}`);
      else if(!(e.state_variables||{})[c.variable])
        out.push(`${id}: ${c.entity}.${c.variable} is not declared`);
    });
    (ev.participants||[]).forEach(x=>{ if(!ents[x]) out.push(`${id}: unknown participant ${x}`); });
  }
  const covered=new Set();
  for(const [id,sc] of Object.entries(scs)){
    (sc.events||[]).forEach(e=>{ covered.add(e); if(!evs[e]) out.push(`${id}: unknown event ${e}`); });
    if(sc.primary_event && !(sc.events||[]).includes(sc.primary_event))
      out.push(`${id}: primary_event not among events`);
    if(!(sc.beats||[]).length) out.push(`${id}: no beats`);
  }
  for(const id in evs) if(!covered.has(id)) out.push(`${id}: realized by no scene`);

  // the fold must apply cleanly
  try{
    const m=buildModel(RAW);
    for(const b of m.beats) for(const c of (b.beat.changes||[])){
      const before=m.before[b.key];
      if(c.op && (c.op.op==="replace"||c.op.op==="remove")){
        const actual=ptrGet(before,c.op.path);
        if(actual===undefined) out.push(`${b.key}: path ${c.op.path} does not exist yet`);
        else if(JSON.stringify(actual)!==JSON.stringify(c.before))
          out.push(`${b.key}: declares before=${JSON.stringify(c.before)} but state holds ${JSON.stringify(actual)}`);
      }
    }
  }catch(e){ out.push("fold failed: "+e.message); }
  return out;
}

/* ---- the tool surface exposed to the model ---- */

     entities:Object.entries(entMap()).map(([k,v])=>({id:k,type:v.type,name:v.canonical_name,
       state_variables:Object.keys(v.state_variables||{})})),

  {name:"upsert_plot", desc:"Create or replace one plot (L4). Needs plot_id, type, title, agent, resistance, goal, stakes, outcome, spine {st1:{step,function,intent,because}}, resolution_step, covers_synopsis.",
   params:{type:"object",properties:{plot:{type:"object"}},required:["plot"]},

  {name:"upsert_entity", desc:"Create or replace one entity dossier (L3). This IS the world state at t0. Needs entity_id, type, canonical_name, salience, plots, profile (with backstory as a sentence map), relationships, state_variables {name:{kind,description,dimension,init}}, state (mirroring every init), arc.",
   params:{type:"object",properties:{entity:{type:"object"}},required:["entity"]},

   params:{type:"object",properties:{
     kind:{type:"string",enum:["story_root","expose","plot","entity","event","scene"]},

       path:{type:"string"}, value:{}, from:{type:"string"}}, required:["op","path"]}}},
     required:["kind","ops"]},

     else if(a.kind==="event") evMap()[a.id]=patched;
     else if(a.kind==="scene") scMap()[a.id]=patched;

  {name:"delete_node", desc:"Remove a plot, entity, event, scene or page.",
   params:{type:"object",properties:{
     kind:{type:"string",enum:["plot","entity","event","scene","prose"]},id:{type:"string"}},
     required:["kind","id"]},
   run:a=>{ if(a.kind==="plot"){ const arr=plotsArr(); const i=arr.findIndex(x=>x.plot_id===a.id);
       if(i<0) throw new Error("no such plot"); arr.splice(i,1); }
     else { const m={entity:entMap(),event:evMap(),scene:scMap(),prose:RAW.prose||{}}[a.kind];
