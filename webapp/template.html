     return {ok:true}; }},

  {name:"show", desc:"Open a tab for the reader and select a node, so they can see what you just made. Use this whenever you finish a piece of work.",
   params:{type:"object",properties:{
     tab:{type:"string",enum:["root","expose","plots","cast","events","scenes","state","reason","script","data"]},
     id:{type:"string",description:"optional: an event, scene or entity id to select"}},required:["tab"]},
   run:a=>{ pendingShow={tab:a.tab,id:a.id||null}; return {ok:true,shown:a.tab+(a.id?" · "+a.id:"")}; }},

  {name:"validate", desc:"Run the structural checks: declared-vs-used state variables, plot and event references, scene coverage, and whether every beat patch applies to the folded world state.",
   params:{type:"object",properties:{},required:[]},
   run:()=>{ const errs=validateBundle();
     return errs.length?{ok:false,count:errs.length,problems:errs.slice(0,40)}
                       :{ok:true,message:"all structural checks pass"}; }},
];
const TOOL_BY_NAME=Object.fromEntries(TOOLS.map(t=>[t.name,t]));
let pendingShow=null;

const SYSTEM_PROMPT=`You are the co-writer inside a structured story-building tool. You and the
user build a screenplay or novel together as an explicit graph, and you change it through tools.

THE LAYERS, in the order they must be built:
  story_root (L0/L1) → expose (L2) → plots (L4) → entities (L3) → events (L5) → scenes (L6) → prose
Plots come before entities on purpose: the plots forward-declare the entity ids they need, and the
entity layer then writes dossiers for exactly those ids.

HARD RULES
1. Entities declare state_variables, and NOTHING else may ever be changed on them. "state" must
   mirror every declared variable's "init" exactly.
2. Every event names at least one plot, exactly one primary_plot, and changes at least one declared
   variable. Its "before" value must be what that variable actually holds at that point in story time.
3. Every scene has exactly one primary_event. Beats carry the literal RFC 6902 ops that move state.
4. Below the exposé, no direct speech: report dialogue as semantics and illocutionary force.
5. Inside entity profiles, prose is decomposed one sentence per key ({b01:{text:"…"}}), and no string
   runs past 180 characters. No arrays inside anything patchable — use id-keyed objects.
6. Ids: ch-NN characters, lo-NN locations, ob-NN objects, gr-NN groups, cn-NN concepts, pl-NN plots,
   ev-NNN events, sc-NNN scenes.

HOW TO WORK
- Call get_overview first, every time, so you know what already exists.
- Build ONE node per tool call. After each meaningful piece, call show(...) so the reader sees it,
  and write one short sentence saying what you did and what comes next. Do not narrate at length.
- FINISHING A LAYER IS NOT FINISHING THE REQUEST. After every tool round, re-read the user's last
  message and ask what of it does not exist yet. If anything is still missing, keep calling tools.
  Only reply without a tool call when every part of the request is actually built. Never end your
  turn describing what you are about to do next — do it, then say what you did.
- When the user asks for the whole thing, work through the layers in order without asking permission
  between steps, staying brief between them.
- When the user asks for a change, prefer the patch tool over rewriting a whole node.
- Call validate after any structural change and fix what it reports.
- Craft: conflict must rise, never sit static. Every scene changes something. Antagonists get
  reasonable motives. Nothing is explained in dialogue that can be dramatised in action. Name the
  crucible that stops characters walking away.
- You are talking to a collaborator, not writing a report. Be concise and concrete.`;

/* ---- chat ---- */
let chatHistory=[];
let chatBusy=false, chatAbort=null;

function chatEl(){ return $("#chatLog"); }
function addMsg(role,text){
  const m=el("div","msg "+(role==="user"?"user":role==="system"?"sys":"bot"));
  m.append(el("div","who",role==="user"?"YOU":role==="system"?"···":"AI"));
  const b=el("div","body"); b.textContent=text||""; m.append(b);
  chatEl().append(m); chatEl().scrollTop=chatEl().scrollHeight;
  return b;
}
function addToolCard(name,args){
  const d=el("div","tool");
  d.append(el("code",null,name));
  const a=el("span","arg",summarizeArgs(name,args));
  d.append(a);
  const r=el("span","res","running…"); d.append(r);
  chatEl().append(d); chatEl().scrollTop=chatEl().scrollHeight;
  return {row:d,res:r};
}
function summarizeArgs(name,args){
  if(!args) return "";
  if(args.plot) return args.plot.plot_id+" "+(args.plot.title||"");
  if(args.entity) return args.entity.entity_id+" "+(args.entity.canonical_name||"");
  if(args.event) return args.event.event_id+" "+(args.event.summary||"").slice(0,60);
  if(args.scene) return args.scene.scene_id+" "+(args.scene.dramatic_function||"").slice(0,60);
  if(args.doc) return args.doc.title||Object.keys(args.doc).slice(0,4).join(", ");
  if(args.ops) return (args.kind||"")+(args.id?" "+args.id:"")+" · "+args.ops.length+" op(s)";
  const s=JSON.stringify(args); return s.length>90?s.slice(0,90)+"…":s;
}
function setBusy(b,label){
  chatBusy=b;
  $("#dockDot").className="dotlive "+(b?"busy":(cfgGet().key?"ready":""));
  $("#dockSub").textContent=b?(label||"working…"):(cfgGet().key?"ready":"set an API key in Settings");
  $("#chatSend").disabled=b;
  $("#chatStop").style.display=b?"":"none";
}

function toolSchemas(){
  return TOOLS.map(t=>({type:"function",function:{name:t.name,description:t.desc,parameters:t.params}}));
}

async function callModel(messages,signal){
  const c=cfgGet();
  if(!c.key) throw new Error("No API key set. Open Settings and paste one.");
  const res=await fetch(c.base.replace(/\/$/,"")+"/chat/completions",{
    method:"POST", signal,
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.key},
    body:JSON.stringify({model:c.model, messages, tools:toolSchemas(), tool_choice:"auto",
      temperature:parseFloat(c.temp)||0.8, max_completion_tokens:32000}),
  });
  if(!res.ok){
    const t=await res.text();
    throw new Error(`HTTP ${res.status}: ${t.slice(0,300)}`);
  }
  return res.json();
}

async function runAgent(userText){
  if(chatBusy) return;
  chatHistory.push({role:"user",content:userText});
  addMsg("user",userText);
  chatAbort=new AbortController();
  setBusy(true,"thinking…");

  const messages=[{role:"system",content:SYSTEM_PROMPT},...chatHistory];
  let rounds=0;
  try{
    while(rounds++ < 40){
      const data=await callModel(messages,chatAbort.signal);
      const msg=data.choices?.[0]?.message;
      if(!msg) throw new Error("empty response");
      messages.push(msg);
      chatHistory.push(msg);

      if(msg.content && msg.content.trim()) addMsg("assistant",msg.content.trim());

      const calls=msg.tool_calls||[];
      if(!calls.length) break;

      let mutated=false;
      for(const call of calls){
        let args={};
        try{ args=JSON.parse(call.function.arguments||"{}"); }catch(e){}
        const card=addToolCard(call.function.name,args);
        const tool=TOOL_BY_NAME[call.function.name];
        let result;
        if(!tool){ result={error:"unknown tool"}; card.res.textContent="unknown"; card.res.className="res bad"; }
        else{
          try{
            setBusy(true,call.function.name);
            result=tool.run(args);
            card.res.textContent="ok";
            if(tool.view||call.function.name==="show") mutated=true;
            if(["set_story_root","set_expose","upsert_plot","upsert_entity","upsert_event",
                "upsert_scene","set_prose","patch","delete_node","new_project"].includes(call.function.name))
              mutated=true;
            if(call.function.name==="validate" && result.ok===false){
              card.res.textContent=result.count+" issue(s)"; card.res.className="res bad";
            }
            if(tool.view){
              const jump=el("button","btn sm jump","view");
              jump.onclick=()=>go(tool.view); card.row.append(jump);
            }
          }catch(err){
            result={error:String(err.message||err)};
            card.res.textContent="failed"; card.res.className="res bad";
            const why=el("div","arg"); why.style.flexBasis="100%"; why.textContent=result.error;
            card.row.append(why);
          }
        }
        const payload={role:"tool",tool_call_id:call.id,content:JSON.stringify(result).slice(0,20000)};
        messages.push(payload); chatHistory.push(payload);
      }
      if(mutated){
        const show=pendingShow; pendingShow=null;
        commit({quiet:true});
        if(show){ go(show.tab);
          if(show.id){ setTimeout(()=>{
            if(show.id.startsWith("ev-")) selectEvent(show.id);
            else if(show.id.startsWith("sc-")) selectScene(show.id);
            else { castSel=show.id; go("cast"); }
          },60); }
        } else { go(current); }
        setBusy(true,"working…");
      }
    }
  }catch(err){
    if(err.name==="AbortError") addMsg("system","Stopped.");
    else addMsg("system","Error: "+(err.message||err));
  }finally{
    setBusy(false); chatAbort=null;
  }
}

function initDock(){
  const dock=$("#dock");
  const setOpen=o=>{ dock.classList.toggle("open",o);
    $("#dockToggle").textContent=o?"Close":"Open";
    $("#dockSub").textContent=o?(cfgGet().key?"ready":"set an API key in Settings"):"click to open";
    document.body.style.paddingBottom=o?"0":"0"; };
  $("#dockBar").onclick=e=>{ if(e.target.closest("button")) return; setOpen(!dock.classList.contains("open")); };
  $("#dockToggle").onclick=()=>setOpen(!dock.classList.contains("open"));
  $("#settingsBtn").onclick=()=>{ dock.classList.add("open"); setOpen(true);
    dock.classList.toggle("settings-open"); };

  const c=cfgGet();
  $("#cfgBase").value=c.base; $("#cfgKey").value=c.key;
  $("#cfgModel").value=c.model; $("#cfgTemp").value=c.temp;
  $("#cfgSave").onclick=()=>{
    cfgSet({base:$("#cfgBase").value.trim()||CFG_DEFAULTS.base, key:$("#cfgKey").value.trim(),
            model:$("#cfgModel").value.trim()||CFG_DEFAULTS.model, temp:$("#cfgTemp").value.trim()||"0.8"});
    $("#cfgStatus").textContent="Saved."; setBusy(false);
  };

  const send=()=>{ const t=$("#chatInput").value.trim(); if(!t||chatBusy) return;
    $("#chatInput").value=""; $("#chatInput").style.height="auto"; runAgent(t); };
  $("#chatSend").onclick=send;
  $("#chatStop").onclick=()=>{ if(chatAbort) chatAbort.abort(); };
  $("#chatInput").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } });
  $("#chatInput").addEventListener("input",e=>{
    e.target.style.height="auto"; e.target.style.height=Math.min(150,e.target.scrollHeight)+"px"; });

  const chips=[
    ["Start something new","Start a new empty project. Ask me for the premise, audience and shape first, then build the story root."],
    ["Build the whole thing","Take the current story root and build every remaining layer in order, showing me each piece as you finish it."],
    ["Walk me through the plots","Walk me through the plots one at a time. Explain what each is doing structurally and show it to me."],
    ["Check for problems","Run validate and tell me what is broken, then propose fixes."],
    ["Continue","Continue with whatever is still missing from my last request. Do not ask, just build it."],
  ];
  const cw=$("#chatChips");
  chips.forEach(([label,prompt])=>{
    const b=el("button","chip",label);
    b.onclick=()=>{ $("#chatInput").value=prompt; $("#chatInput").focus(); };
    cw.append(b);
  });

  // A published artifact runs under a CSP that blocks external hosts, so the
  // chat cannot reach any API from there. Say so rather than failing silently.
  if(location.hostname.endsWith("claude.ai")){
    const w=$("#cfgCsp"); w.style.display="";
    w.textContent="This page is running as a published artifact, where a strict content policy "+
      "blocks calls to external hosts. The co-writer needs the page served from your own machine "+
      "or host to reach an API.";
  }
  addMsg("system","Co-writer ready. Set an API key in Settings, then tell me what you want to build "+
    "— or ask me to change something that already exists. I work through tools, and I will open the "+
    "relevant tab as I go.");
  setBusy(false);
}

/* ---- file download / upload ---- */
function downloadBundle(){
  const name=(RAW.story_root?.title||"story").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const blob=new Blob([JSON.stringify(RAW,null,1)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=(name||"story")+".narrativeforge.json";
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ============================================================ boot */
function boot(){
  $("#brandTitle").textContent=M.root.title||"Untitled";
  $("#brandForm").textContent=(M.root.form||"story")+" · "+(M.root.genre_primary||"").replace(/_/g," ");
  const st=$("#railStats"); st.innerHTML="";
  const rows=[["plots",M.plotIds.length],["entities",Object.keys(M.entities).length],
              ["events",M.eventOrder.length],["scenes",M.sceneOrder.length],
              ["beats",M.beats.length],
              ["patch ops",M.beats.reduce((n,b)=>n+(b.beat.changes||[]).length,0)],
              ["script pages",Object.keys(M.prose).length],
              ["transitions",Object.keys(M.transitions||{}).length]];
  rows.forEach(([k,v])=>{const r=el("div","row"); r.append(el("span",null,k),el("b",null,String(v))); st.append(r);});
  nav();
}

$("#themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const sysDark=matchMedia("(prefers-color-scheme: dark)").matches;
  const now = cur || (sysDark?"dark":"light");
  document.documentElement.setAttribute("data-theme", now==="dark"?"light":"dark");
  if(current==="events"||current==="scenes") go(current);
};

RAW=clone(DATA);
M=buildModel(RAW);
boot();
initDock();
const start=(location.hash||"").replace("#","");
go(VIEWS.some(v=>v.id===start)?start:"root");
window.addEventListener("hashchange",()=>{
  const h=(location.hash||"").replace("#","");
  if(h&&h!==current&&VIEWS.some(v=>v.id===h)) go(h);
});
</script>
